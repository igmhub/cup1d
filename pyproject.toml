[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name="cup1d"
dynamic = ["version"]
authors = [
    { name="Jonas Chaves-Montero", email="jchaves@ifae.es" },
    { name="Andreu Font-Ribera", email="afont@ifae.es" },
    { name="Chris Pedersen" },
]
maintainers = [
    { name="Jonas Chaves-Montero", email="jchaves@ifae.es" },
    { name="Andreu Font-Ribera", email="afont@ifae.es" },
]
description = "Likelihood for Lyman-alpha 1D power spectrum"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "Lyman-alpha", "Cosmology", "Power Spectrum", "Emulator",
]
requires-python = ">= 3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "emcee",
    "getdist",
    "mpi4py",
    "corner",
    "alphashape",
    "shapely",
    "astropy",
    "PyYAML",
    "pyswarms>=1.3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific :: Cosmology/Astrophysics",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]
docs = [
    "sphinx>=7",
    "numpydoc>=1.6",
    "pydata-sphinx-theme>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external_model: regression tests requiring an external LaCE model bundle",
]

[tool.setuptools.packages.find]
include = ["cup1d","cup1d.*"]
namespaces = false

[tool.setuptools.package-data]
cup1d = ["configuration/*.yaml"]

[project.urls]
Homepage="https://github.com/igmhub/cup1d"
Documentation="https://igmhubcup1d.readthedocs.io/en/latest/"
Repository="https://github.com/igmhub/cup1d.git"
Issues="https://github.com/igmhub/cup1d/issues"
