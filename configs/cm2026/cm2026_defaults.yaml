## Data
# P1D datasets included in the analysis.
data_label:
- DESIY1_QMLE3
# Multiplicative factor applied to the measured P1D.
data_bias: 1.0
# Minimum redshift included in the analysis.
z_min: 2.2
# Maximum redshift included in the analysis.
z_max: 4.2
# Redshift-bin width used to construct regular grids.
zbin_width: 0.2
# Factor controlling interpolation before k-bin rebinning.
k_rebin_factor: 8
# Optional explicit P1D measurement filename.
p1d_fname: null
# Optional base directory for input data.
path_data: null

## Emulator
# Identifier of the P1D emulator.
emulator_label: CH24_mpgcen_gpr
# Simulation omitted from emulator training, or null to use all simulations.
drop_emu_sim: null

## Cosmology
# Fiducial cosmology used by the likelihood model.
fid_cosmo_label: Planck18
# Pivot redshift for compressed linear-power parameters.
z_star: 3
# Pivot wavenumber in inverse velocity units.
kp_kms: 0.009
# Whether cosmological parameters are fixed.
fix_cosmo: false
# Whether running parameters of the primordial spectrum are varied.
vary_alphas: false

## IGM model
# Names of the intergalactic-medium model parameters.
igm_params:
- tau_eff
- sigT_kms
- gamma
- kF_kms
# Fiducial IGM model and its free-parameter configuration.
fid_igm:
  # Common scaling applied to the model priors.
  priors: 1.0
  # Simulation or observational reference for `mF`.
  label_mF: mpg_central
  # Simulation or observational reference for `T`.
  label_T: mpg_central
  # Simulation or observational reference for `kF`.
  label_kF: mpg_central
  # Number of free redshift nodes for Effective optical-depth evolution.
  n_tau_eff: 4
  # Number of free redshift nodes for Thermal broadening in km/s.
  n_sigT_kms: 4
  # Number of free redshift nodes for Slope of the IGM temperature-density relation.
  n_gamma: 4
  # Number of free redshift nodes for Pressure-smoothing scale in inverse velocity units.
  n_kF_kms: 4
  # Redshift interpolation scheme for Effective optical-depth evolution.
  tau_eff_ztype: interp_lin
  # Coefficient parameterization for Effective optical-depth evolution.
  tau_eff_otype: exp
  # Whether Effective optical-depth evolution. is fixed.
  tau_eff_fixed: false
  # Redshift interpolation scheme for Thermal broadening in km/s.
  sigT_kms_ztype: interp_lin
  # Coefficient parameterization for Thermal broadening in km/s.
  sigT_kms_otype: const
  # Whether Thermal broadening in km/s. is fixed.
  sigT_kms_fixed: false
  # Redshift interpolation scheme for Slope of the IGM temperature-density relation.
  gamma_ztype: interp_lin
  # Coefficient parameterization for Slope of the IGM temperature-density relation.
  gamma_otype: const
  # Whether Slope of the IGM temperature-density relation. is fixed.
  gamma_fixed: false
  # Redshift interpolation scheme for Pressure-smoothing scale in inverse velocity units.
  kF_kms_ztype: interp_lin
  # Coefficient parameterization for Pressure-smoothing scale in inverse velocity units.
  kF_kms_otype: const
  # Whether Pressure-smoothing scale in inverse velocity units. is fixed.
  kF_kms_fixed: false

