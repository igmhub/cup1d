# Generated by scripts/configs/generate_cm2026.py.
# This is a fully resolved configuration and can be edited directly.

## Data
# P1D datasets included in the analysis.
data_label:
- DESIY1_QMLE3
# Multiplicative factor applied to the measured P1D.
data_bias: 1.0
# Minimum redshift included in the analysis.
z_min: 2.2
# Maximum redshift included in the analysis.
z_max: 4.2
# Redshift-bin width used to construct regular grids.
zbin_width: 0.2
# Factor controlling interpolation before k-bin rebinning. 32: |dchi2| <= 0.011
# near the best fit against 128 (8: up to 1.5); see
# notebooks/validation/convergence_rebin_quadrature.
k_rebin_factor: 32
# Number of log-spaced k points per redshift on which the emulator is
# evaluated before interpolating to the rebinning grid. Null evaluates the
# emulator at every rebinning point. 64: |dchi2| <= 0.0033 on DESI DR1, ~17x
# faster (convergence_rebin_quadrature).
n_k_emu: 64
# With several data sets at the same redshifts (e.g. DESI + high resolution),
# evaluate the model once per redshift on one fine grid and average it into
# every data set's bins (cup1d.utils.rebinning.shared_fine_grid). False, or
# different redshifts: one fine grid per data set.
shared_k_grid: true
# Optional explicit P1D measurement filename.
p1d_fname: null
# Optional file with the P1D covariance and systematics: null uses p1d_fname,
# "default" the standard file of the data label (DESI only).
p1d_cov_fname: null
# Optional base directory for input data.
path_data: null

