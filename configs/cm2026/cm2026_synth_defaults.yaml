## Instrumental systematics
# Fiducial instrumental-systematic model.
fid_syst:
  # Resolution correction: exponential (Gaussian kernel) or linear (first order).
  R_form: exponential
  # Number of free redshift nodes for Spectrograph-resolution correction coefficient.
  n_R_coeff: 11
  # Redshift interpolation scheme for Spectrograph-resolution correction coefficient.
  R_coeff_ztype: interp_lin
  # Coefficient parameterization for Spectrograph-resolution correction coefficient.
  R_coeff_otype: const
  # Whether Spectrograph-resolution correction coefficient. is fixed.
  R_coeff_fixed: false
# Data labels to which the spectrograph-resolution correction (R_coeff) is
# applied; null applies it to every data set.
syst_data_labels: null
# Whether to apply the initial-condition correction.
ic_correction: false

## Covariance
# Structure assumed for the observational systematic covariance.
cov_syst_type: red
# Emulator covariance representation: full, diagonal, or block.
emu_cov_type: full
# Numerical representation used for the likelihood covariance quadratic form.
covariance_method: inverse
# Redshift-dependent covariance rescaling factors.
cov_factor:
  # Multiplicative factors for statistical errors.
  val_stat: 1.05
  # Multiplicative factors for systematic errors.
  val_syst: 1.0
  # Multiplicative factors for emulator errors.
  val_emu: 1.0
  # Multiplicative factors applied to the full covariance.
  val_full: 1.0

## Priors
# Optional priors on compressed linear-power parameters.
use_star_priors: null
# Optional common RMS for Gaussian priors.
prior_Gauss_rms: null
# Optional lower prior bound of the logarithmic metal and HCD amplitudes
# (e.g. -10.5 to switch them off in synthetic data); null keeps the defaults.
cont_log_amp_min: null
# Optional parameter-specific Gaussian priors.
Gauss_priors: null
# If set, As and ns flat priors span the emulator-training mean +- this many
# standard deviations (a reasonable flat range around the training set);
# null keeps the training range expanded by 25%.
cosmo_prior_nsigma: 2.0
# Check whether the emulator inputs of each point are inside the convex hull
# of the training simulations, in every pair of inputs (~0.1 ms per point).
use_hull: true
# Fractional expansion of that hull about the training mean (0: strict hull).
hull_margin: 0.05
# Reject the points outside (true), or keep them and report the fraction
# (false). The DR1 initial conditions need a margin of 0.60 and the 2025 best
# fit 0.54 to be inside (gamma at z = 2.2 is 1.94; the training maximum is
# 1.82): rejecting changes the baseline.
hull_reject: false

## Inference
# Inference configuration used for this analysis.
fit_type: global_opt
# Sampler configuration.
mcmc:
  # Base seed for MCMC walker initialization; null uses fresh entropy.
  seed: null
  # Whether walkers explore around the initial position.
  explore: true
  # Whether likelihood evaluations use parallel execution.
  parallel: true
  # Number of discarded burn-in steps per walker.
  n_burn_in: 1500
  # Number of retained sampling steps per walker.
  n_steps: 2000
  # Walkers per free parameter (nwalkers = n_walkers x ndim; at least
  # 2 ndim + 1, the emcee minimum).
  n_walkers: 10
  # With MPI: single (one ensemble, walkers evaluated by all ranks) or
  # independent (one ensemble per rank, R-1 between them).
  mpi_ensemble: single
  # Write the chain to emcee_chain.h5 while running.
  backend: true
  # Continue the chain of an existing emcee_chain.h5 of the same shape.
  resume: true
  # Keep one sample for every this many sampler steps.
  thin: 20
# Initial-condition filename, resolved relative to `path_ic`.
file_ic: DESIY1_QMLE3_lace_mpg_ic_global.npy
# Directory containing initial-condition corrections.
path_ic: null  # Resolved to the installed cup1d package data directory.

## Output and runtime
# Directory in which analysis products are written. Set it explicitly in every
# analysis YAML. If null, it is derived as <path_out>/<data_labels joined by
# '__'>/<name_variation, or fit_type if null>/<emulator_label>.
out_folder: null
# Root directory used when out_folder is null; scripts/data/data_sampler.py
# --path_out overrides it from the command line.
path_out: .
# Optional computing-system identifier.
system: null
# Whether the analysis prints progress information.
verbose: true
# Name of the analysis variation, or null for the baseline.
name_variation: null
