# Combine the DESI DR1 baseline P1D with the Karacayli et al. (2022)
# high-resolution measurement. All other settings use CM2026 defaults.
data_label:
  - DESIY1_QMLE3
  - Karacayli2022
# Apply the same explicit line-of-sight scale cut for either emulator.
kmax_ikms: 0.07
# Spectrograph-resolution corrections (CM2026 default R_coeff nodes) are
# applied to DESI only; the high-resolution P1D receives no correction.
syst_data_labels:
  - DESIY1_QMLE3
# Output folder.
out_folder: ./DESIY1_QMLE3__Karacayli2022/global_opt/lace_mpg
